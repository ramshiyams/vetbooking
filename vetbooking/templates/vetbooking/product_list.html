{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>VetOnClick - Products</title>
</head>
<body>
    <h2>Available Products</h2>

    {% if products %}
        {% for product in products %}
            <div style="border:1px solid #ccc; padding:10px; margin:10px;">
                <h3>{{ product.name }}</h3>
                <p>₹{{ product.price }}</p>
                <p>{{ product.description }}</p>
                {% if product.image %}
                    <img src="{{ product.image.url }}" width="200" height="150" alt="{{ product.name }}">
                {% endif %}
            </div>
        {% endfor %}
    {% else %}
        <p>No products available.</p>
    {% endif %}
</body>
</html>
