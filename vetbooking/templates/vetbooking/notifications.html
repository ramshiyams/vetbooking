{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2 class="text-center mb-4">🔔 Notifications</h2>

  {% if notifications %}

  <div class="list-group shadow-sm">
    {% for note in notifications %}
      <div class="list-group-item d-flex justify-content-between align-items-center
        {% if note.status == 'Pending' %}list-group-item-warning{% else %}list-group-item-success{% endif %}">
        <div>
          <strong>{{ note.message }}</strong><br>
          <small class="text-muted">{{ note.created_at|date:"M d, Y - H:i" }}</small>
        </div>
        <span class="badge bg-dark">{{ note.status }}</span>
      </div>
    {% endfor %}
  </div>

  {% else %}
  <div class="alert alert-info text-center mt-3">No notifications yet.</div>
  {% endif %}
</div>
{% endblock %}
