{% extends 'base.html' %}
{% block content %}
<html>
<head>
<style>
/* ====== E-Commerce Product Grid Style ====== */
.product-card {
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    height: 100%;
    border: 1px solid #e0e0e0;
}

.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

/* 🔹 Image styling (realistic e-commerce look) */
.product-card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background-color: #fff;
    padding: 10px;
    transition: transform 0.3s ease;
}

/* Zoom on hover */
.product-card:hover img {
    transform: scale(1.05);
}

.card-body {
    padding: 15px;
}

.card-title {
    font-size: 1rem;
    font-weight: 600;
    color: #333;
    min-height: 45px;
}

.card-text {
    font-size: 0.9rem;
    color: #555;
    height: 45px;
    overflow: hidden;
}

/* Price */
.product-price {
    font-size: 1.1rem;
    font-weight: bold;
    color: #1a73e8;
    margin-top: 8px;
}

/* Buttons */
.btn-sm {
    font-size: 0.85rem;
    padding: 6px 10px;
}

.btn-primary {
    background-color: #ff9900;
    border: none;
}

.btn-success {
    background-color: #34a853;
    border: none;
}

/* Responsive grid */
@media (max-width: 992px) {
    .col-md-3 {
        flex: 0 0 50%;
        max-width: 50%;
    }
}

@media (max-width: 576px) {
    .col-md-3 {
        flex: 0 0 100%;
        max-width: 100%;
    }
}
</style>
</head>

<body>
<div class="container mt-4">
    <h2 class="text-center mb-4">🩺 Available Products </h2>
    <div class="row justify-content-center">
        {% for product in products %}
        <div class="col-md-3 col-sm-6 mb-4 d-flex">
            <div class="card product-card text-center flex-fill">
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description|truncatewords:15 }}</p>
                    <p class="product-price">₹{{ product.price }}</p>
                    <div>
                        <a href="{% url 'buy_now' product.id %}" class="btn btn-success">Buy Now</a>

                        <a href="{% url 'add_to_cart' product.id %}" class="btn btn-success btn-sm">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <p class="text-center">No products available right now.</p>
        {% endfor %}


    </div>
</div>


</body>
</html>
{% endblock %}
