{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | VetOnClick</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            width: 380px;
            padding: 40px 35px;
            text-align: center;
            animation: fadeIn 0.7s ease-in-out;
        }

        .login-box h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .login-box h2 span {
            font-size: 30px;
            margin-right: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            background: #f6f9fc;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #4CB8C4;
            box-shadow: 0 0 6px rgba(76, 184, 196, 0.5);
            outline: none;
        }

        .login-btn {
            background-color: #4CB8C4;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background-color: #3ca7b3;
            transform: scale(1.02);
        }

        .footer-text {
            margin-top: 15px;
            color: #555;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2><span>👩‍💼</span>Admin Login</h2>
        <form method="POST" action="{% url 'admin-login' %}">
            {% csrf_token %}
            <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
            <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
            <button type="submit" class="login-btn">Login</button>
        </form>
        <div class="footer-text">
            Welcome back to <b>VetOnClick</b>
        </div>
    </div>
</body>
</html>
